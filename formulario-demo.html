<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Demo - Metanoia.Click</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-container {
            background-color: #111827; /* Gris oscuro similar al tema dark */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2.5rem;
            max-width: 500px;
            margin: 2rem auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .form-input, .form-select, .form-textarea {
            background-color: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
            color: #E5E7EB; /* Texto gris claro */
            border-radius: 0.5rem;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #3874FF; /* Azul primario */
            box-shadow: 0 0 0 2px rgba(56, 116, 255, 0.4);
        }
        .btn-primary {
            background-color: #3874FF; /* Azul primario */
            color: white;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #2c5ddc; /* Azul más oscuro */
        }
    </style>
</head>
<body class="bg-[#090E1A] text-white">

    <div class="form-container">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">Solicita una Demo</h1>
            <p class="text-gray-400 mt-2">Completa el formulario y un especialista se pondrá en contacto.</p>
        </div>

        <!-- 
          INSTRUCCIONES:
          1. Ve a https://formspree.io/ y crea una cuenta gratuita.
          2. Crea un nuevo formulario y obtén tu endpoint (URL).
          3. Reemplaza "TU_URL_DE_FORMSPREE" en la línea de abajo con tu URL real.
        -->
        <form action="TU_URL_DE_FORMSPREE" method="POST" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-300 mb-2">Nombre Completo</label>
                    <input type="text" name="name" id="name" required class="form-input w-full p-3" placeholder="John Doe">
                </div>
                <div>
                    <label for="company" class="block text-sm font-medium text-gray-300 mb-2">Empresa</label>
                    <input type="text" name="company" id="company" required class="form-input w-full p-3" placeholder="Tu Empresa Inc.">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Corporativo</label>
                <input type="email" name="email" id="email" required class="form-input w-full p-3" placeholder="john.doe@tuempresa.com">
            </div>

            <div>
                <label for="module" class="block text-sm font-medium text-gray-300 mb-2">Módulo de Interés</label>
                <select id="module" name="module" required class="form-select w-full p-3">
                    <option value="">Selecciona un módulo</option>
                    <option value="Inteligencia de Negocios">Inteligencia de Negocios</option>
                    <option value="Análisis Financiero">Análisis Financiero</option>
                    <option value="Gestión de Créditos">Gestión de Créditos</option>
                    <option value="Recursos Humanos">Recursos Humanos</option>
                    <option value="Automatización de Procesos">Automatización de Procesos</option>
                    <option value="Todos">Todos los módulos</option>
                </select>
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-300 mb-2">Mensaje (Opcional)</label>
                <textarea id="message" name="message" rows="4" class="form-textarea w-full p-3" placeholder="Cuéntanos un poco sobre tus necesidades..."></textarea>
            </div>

            <div>
                <button type="submit" class="w-full btn-primary p-3 text-base">
                    Enviar Solicitud
                </button>
            </div>
        </form>
    </div>

</body>
</html>
